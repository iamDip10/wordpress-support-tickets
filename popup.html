<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WP Support Monitor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="app-title">WP Monitor</span>
    </div>
    <div id="statusDot" class="status-dot idle" title="Status"></div>
  </div>

  <div class="card setup-card">
    <label class="label">Forum URL</label>
    <div class="input-row">
      <input type="text" id="urlInput"
        placeholder="https://wordpress.org/support/plugin/your-plugin/" />
      <button id="saveBtn">Monitor</button>
    </div>
    <div id="activeUrl" class="active-url hidden"></div>
    <div id="lastError" class="error-msg hidden"></div>
  </div>

  <div class="card feed-card">
    <div class="feed-header">
      <span class="feed-title">Waiting for Support</span>
      <div class="header-right">
        <span id="ticketCount" class="ticket-count"></span>
        <button id="recheckBtn" class="clear-btn">↻ Refresh</button>
      </div>
    </div>
    <div id="activityFeed" class="feed">
      <div class="empty-state">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" opacity="0.3">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
            stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <p>All clear!</p>
        <small>No tickets waiting for support</small>
      </div>
    </div>
  </div>

  <div class="footer">
    Auto-refreshes every 15s &nbsp;·&nbsp; Last: <span id="lastCheck">never</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
